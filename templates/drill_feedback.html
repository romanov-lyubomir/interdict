{# Filled in by static/drill.js after every answer #}

    <div class="center">
        <h3 id="verdict"></h3>
    </div>
    <div class="center">
        <h4 id="answerLine" class="answer-line"><span class="answer-prefix">The correct answer is </span><span

    <div class="center">
        <div id="message" class="error" hidden></div>
    </div>
</div>
