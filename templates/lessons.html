{% extends "base.html" %}
{% block imports %}
{% endblock %}

{% block css %}
<style>
    .page {
        width: min(620px, calc(100vw - 32px));
        margin: 0 auto;
    }

    .lesson-card {
        display: flex;
        align-items: center;
        gap: 16px;
        margin: 0 0 14px;
        padding: 18px 20px;
        transition: border-color .2s;
    }

    .lesson-card:hover {
        text-decoration: none;
        border-color: var(--accent);
    }

    .lesson-number {
        display: grid;
        place-items: center;
        flex-shrink: 0;
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background-color: var(--accent-soft);
        color: var(--accent);
        font-weight: 700;
    }

    .lesson-card h3 {
        font-size: 18px;
    }

    .lesson-card .arrow {
        margin-left: auto;
        color: var(--faint);
        font-size: 20px;
    }
</style>
{% endblock %}


{% block body %}
<a href="{{ url_for('index') }}">
    <svg class="svg-x" width="16" height="16" viewBox="0 0 16 16">
        <g fill="none" fill-rule="evenodd">
            <path fill="#fff"
                d="M6.93 8l-4.7-4.7a.76.76 0 1 1 1.06-1.08L8 6.92l4.7-4.7a.76.76 0 0 1 1.08 1.07L9.08 8l4.7 4.7a.76.76 0 1 1-1.07 1.08L8 9.08l-4.7 4.7a.76.76 0 0 1-1.08-1.07L6.92 8z">
            </path>
        </g>
    </svg>
</a>
<div class="page">
    <h1 class="title">Lessons</h1>
    {% for lesson in lessons %}
    <a class="container shadow lesson-card" href="{{ url_for('lesson_for_topic', topic=lesson) }}">
        <span class="lesson-number">{{ loop.index }}</span>
        <h3>{{ lesson | format }}</h3>
        <span class="arrow">&rarr;</span>
    </a>
    {% endfor %}
</div>
{% endblock %}
