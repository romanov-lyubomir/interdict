{% extends "base.html" %}
{% block imports %}
{% endblock %}

{% block css %}
<style>
    .settings {
        width: 90vw;
        max-width: 560px;
    }

    fieldset {
        border: 1px solid var(--border-strong);
        border-radius: 10px;
        padding: 10px 15px 15px;
        margin-bottom: 15px;
    }

    legend {
        padding: 0 8px;
        font-size: 18px;
    }

    .hint {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 15px;
    }

    .start {
        font-size: 18px;
        padding: 10px 30px;
    }
</style>
{% endblock %}

{% block body %}
<a href="{{ back_url }}">
    <svg class="svg-x" width="16" height="16" viewBox="0 0 16 16">
        <g fill="none" fill-rule="evenodd">
            <path fill="#fff"
                d="M6.93 8l-4.7-4.7a.76.76 0 1 1 1.06-1.08L8 6.92l4.7-4.7a.76.76 0 0 1 1.08 1.07L9.08 8l4.7 4.7a.76.76 0 1 1-1.07 1.08L8 9.08l-4.7 4.7a.76.76 0 0 1-1.08-1.07L6.92 8z">
            </path>
        </g>
    </svg>
</a>
<div class="center">
    <h1 class="title">{{ title }}</h1>
</div>

<div class="center">
    <form class="shadow settings" action="{{ request.path }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <p class="hint">{{ hint }}</p>

        {% include "quiz_length.html" %}

        <div class="center">
            <input class="start" type="submit" value="Start" autofocus>
        </div>
    </form>
</div>
{% endblock %}
