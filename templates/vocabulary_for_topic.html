{% extends "base.html" %}
{% block imports %}
<script src="{{ url_for('static', filename='drill.js') }}"></script>
{% endblock %}

{% block css %}
<style>
    .big {
        font-size: 20px;
    }

    .word-image {
        width: 80vw;
        height: calc(80vw / 1.5);
        max-width: 450px;
        max-height: 300px;
        margin-bottom: 30px;
    }

</style>
{% endblock %}


{% block body %}
<a href="{{ url_for('vocabulary_topics') }}">
    <svg class="svg-x" width="16" height="16" viewBox="0 0 16 16">
        <g fill="none" fill-rule="evenodd">
            <path fill="#fff"
                d="M6.93 8l-4.7-4.7a.76.76 0 1 1 1.06-1.08L8 6.92l4.7-4.7a.76.76 0 0 1 1.08 1.07L9.08 8l4.7 4.7a.76.76 0 1 1-1.07 1.08L8 9.08l-4.7 4.7a.76.76 0 0 1-1.08-1.07L6.92 8z">
            </path>
        </g>
    </svg>
</a>

{% include "quiz_progress.html" %}

<div class="center">
    <div class="drill-feedback word-correct-message">
        {% include "drill_feedback.html" %}
    </div>
</div>

<div class="image-form-div">
    <div class="center">
        <img id="wordImage" class="shadow word-image" src="{{ image_url or '' }}" alt="{{ english }}"
            {% if not image_url %}hidden{% endif %}>
    </div>
    <div class="center">
        <form id="drillForm" action="{{ request.path }}" class="shadow"
            method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="center">
                <p class="big">Translate <b id="english">{{ english }}</b> into {{ user_language | capitalize }}</p>
            </div>
            <div class="center">
                <input spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" id="inputField"
                    class="big" type="text" name="user_input" autofocus>
            </div>
            <input type="submit" hidden />
        </form>
    </div>
</div>

<script>
    const wordImage = document.getElementById("wordImage");
    setupDrill({
        audioUrl: {{ audio_url | tojson }},
        showQuestion: (word) => {
            document.getElementById("english").textContent = word.english;
            wordImage.alt = word.english;
            wordImage.hidden = !word.image_url;
            if (word.image_url) {
                wordImage.src = word.image_url;
            } else {
                wordImage.removeAttribute("src");
            }
        },
    });
</script>
{% endblock %}
