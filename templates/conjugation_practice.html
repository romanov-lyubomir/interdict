{% extends "base.html" %}
{% block imports %}
<script src="{{ url_for('static', filename='drill.js') }}"></script>
{% endblock %}

{% block css %}
<style>
    .quiz-progress {
        position: absolute;
        top: 70px;
    }

    .verb-correct-message {
        position: absolute;
        top: 100px;
    }

    .error {
        margin-top: 10px;
    }

    .image-form-div {
        position: relative;
        top: 150px;
    }

    .big {
        font-size: 20px;
    }

    .form-label {
        font-size: 15px;
        color: #C0C0C0;
        margin-bottom: 10px;
        text-align: center;
    }

    .settings-link {
        font-size: 13px;
        color: #C0C0C0;
        text-decoration: underline;
    }

    @media screen and (min-width: 500px) {
        .form {
            min-width: 400px;
        }
    }
</style>
{% endblock %}


{% block body %}
<a href="{{ url_for('conjugation_drill') }}">
    <svg class="svg-x" width="16" height="16" viewBox="0 0 16 16">
        <g fill="none" fill-rule="evenodd">
            <path fill="#fff"
                d="M6.93 8l-4.7-4.7a.76.76 0 1 1 1.06-1.08L8 6.92l4.7-4.7a.76.76 0 0 1 1.08 1.07L9.08 8l4.7 4.7a.76.76 0 1 1-1.07 1.08L8 9.08l-4.7 4.7a.76.76 0 0 1-1.08-1.07L6.92 8z">
            </path>
        </g>
    </svg>
</a>

{% include "quiz_progress.html" %}

<div class="center">
    <div class="verb-correct-message">
        {% include "drill_feedback.html" %}
    </div>
</div>

<div class="image-form-div">
    <div class="center">
        <form id="drillForm" action="{{ url_for('conjugation_practice') }}" class="shadow" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <p id="formLabel" class="form-label">{{ form_label }}</p>
            <div id="pronounRow" class="center" {% if not pronoun %}hidden{% endif %}>
                <p id="pronoun" class="big">{{ pronoun or '' }}</p>
            </div>
            <div class="center">(<span id="verb">{{ verb }}</span>)</div>
            <div class="center">
                <input spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" id="inputField"
                    class="big" type="text" name="user_input" autofocus>
            </div>
            <input type="submit" hidden />
        </form>
    </div>
    <div class="center">
        <a class="settings-link" href="{{ url_for('conjugation_drill') }}">Change verb forms</a>
    </div>
</div>

<script>
    setupDrill({
        audioUrl: {{ audio_url | tojson }},
        showQuestion: (question) => {
            document.getElementById("formLabel").textContent = question.form_label;
            document.getElementById("pronoun").textContent = question.pronoun || "";
            document.getElementById("pronounRow").hidden = !question.pronoun;
            document.getElementById("verb").textContent = question.verb;
        },
    });
</script>
{% endblock %}
